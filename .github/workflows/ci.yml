name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: make test
      - run: make research
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --locked

  arm64-release:
    name: Locked ARM64 release artifact
    needs: quality
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TARGET: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.1
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: arm64-release
      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Test locked ARM64 target
        run: cargo test --all-targets --locked --target "$TARGET"
      - name: Build locked ARM64 release
        run: cargo build --release --locked --bins --target "$TARGET"
      - name: Package checksummed release
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive="hype-accumulator-${COMMIT_SHA}-${TARGET}.tar.gz"
          stage="dist/stage"
          mkdir -p "$stage"

          install -m 0755 "target/${TARGET}/release/hype-accumulator" "$stage/hype-accumulator"
          install -m 0755 "target/${TARGET}/release/hype-status" "$stage/hype-status"
          {
            printf 'repository=%s\n' "$REPOSITORY"
            printf 'commit=%s\n' "$COMMIT_SHA"
            printf 'target=%s\n' "$TARGET"
            rustc --version --verbose
            cargo --version --verbose
            sha256sum Cargo.lock
          } > "$stage/BUILD-PROVENANCE.txt"
          (
            cd "$stage"
            sha256sum BUILD-PROVENANCE.txt hype-accumulator hype-status > SHA256SUMS
          )

          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$stage" \
            -czf "dist/$archive" \
            BUILD-PROVENANCE.txt SHA256SUMS hype-accumulator hype-status
          (
            cd dist
            sha256sum "$archive" > "$archive.sha256"
            sha256sum --check "$archive.sha256"
          )
      - name: Attest release provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Upload immutable ARM64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hype-accumulator-${{ github.sha }}-aarch64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

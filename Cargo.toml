[package]
name = "hype-accumulator"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde"] }
dex-connector = { git = "https://github.com/shigeo-nakamura/dex-connector", tag = "v4.7.12", default-features = false, features = ["hyperliquid-sdk"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "=1.42.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.143"
thiserror = "=2.0.12"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "=0.8.23"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[package]
name = "hype-accumulator"
version = "0.1.0"
edition = "2021"
publish = false

[features]
offline-staking-simulation = []
live-probe = ["dep:debot-utils"]

[[bin]]
name = "hype-live-probe"
path = "src/bin/hype-live-probe.rs"
required-features = ["live-probe"]

[dependencies]
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde"] }
debot-utils = { version = "=1.0.34", optional = true }
dex-connector = { git = "https://github.com/shigeo-nakamura/dex-connector", tag = "v4.7.20", default-features = false, features = ["hyperliquid-sdk"] }
fs2 = "=0.4.3"
libc = "=0.2.189"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
rusoto_core = "=0.48.0"
rusoto_s3 = "=0.48.0"
rust_decimal = "=1.42.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.12"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "=0.8.23"

[target.'cfg(windows)'.dependencies]
winx = "=0.36.4"

[target.'cfg(any(target_os = "android", target_os = "linux", target_vendor = "apple", target_os = "redox"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

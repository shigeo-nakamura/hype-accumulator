[package]
name = "hype-accumulator"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde"] }
dex-connector = { git = "https://github.com/shigeo-nakamura/dex-connector", tag = "v4.7.14", default-features = false, features = ["hyperliquid-sdk"] }
fs2 = "=0.4.3"
libc = "=0.2.189"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "=1.42.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.12"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "=0.8.23"

[target.'cfg(windows)'.dependencies]
winx = "=0.36.4"

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

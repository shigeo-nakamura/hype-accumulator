# Safe template; identity and signing material come from named environment variables.
dry_run = true
manual_halt = true
live_approved = false
# Who records the UTC day's pacing decision (bot-strategy#1028). The default
# "recurring_cycle" lets --dry-run-cycle decide (and zero-settle/suppress) it.
# "scheduled_live_unit" hands the slot to `hype-live-probe run-cycle` and makes
# --dry-run-cycle observe-only; it is only valid on a dry_run = true pair.
decision_owner = "recurring_cycle"
validator_allowlist = ["validator-test"]

[capital]
min_deposit_confirmations = 2
max_automatically_deployable_usdc = 100.0
yearly_deployment_cap_usdc = 500.0
cumulative_deployment_cap_usdc = 1000.0

[pacing]
min_order_usdc = 5.0
max_order_usdc = 25.0
deposit_cooldown_seconds = 3600
target_horizon_days = 365
fee_spread_reserve_bps = 25
final_catch_up_days = 7
carry_over_policy = "hold_for_approval"

[schedule]
utc_hour = 12
utc_minute = 0
weekdays = [1, 3, 5]

[hyperliquid]
endpoint = "https://example.invalid"
account_env = "HYPE_ACCOUNT_ID"
signing_key_env = "HYPE_SIGNING_KEY"

[execution]
max_order_usdc = 25.0
max_slippage_bps = 20
order_timeout_seconds = 30

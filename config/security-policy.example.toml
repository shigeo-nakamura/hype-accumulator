# Non-production shape only. Zero disables a capability; it never means unlimited.
[capital]
max_auto_deposit_microusd = 0
max_daily_notional_microusd = 0
max_yearly_deployable_microusd = 0
max_cumulative_deployable_microusd = 0
reserve_microusd = 0

[custody]
# Service-side order limits do not constrain a leaked API wallet.
api_wallet_authority = "full_assigned_account_trading"
require_dedicated_execution_account = true
# Operational halt/alert only; this does not bound a leaked wallet.
max_hot_trading_balance_microusd = 0
# Safe default. Live mode rejects this. Any externally enforced or explicitly
# accepted uncapped-authority mode requires separate evidence and must be bound
# into the effective-policy acknowledgement.
hot_balance_enforcement = "unapproved"
# Safe default: only direct external deposits can originate admitted capital.
# The only alternative is "traced_parent_transfer" with explicit approval.
funding_mode = "external_deposit_only"
allow_traced_parent_transfer_admission = false
# Empty disables inheritance; never place an account address in this file. In
# live mode the named variable must resolve at startup to a valid canonical
# account address. The resolved value (not only this name) is included in the
# effective-policy digest covered by the live acknowledgement.
admitted_parent_account_env = ""

[execution]
max_slippage_bps = 0
book_stale_after_seconds = 0
account_history_stale_after_seconds = 0
signal_stale_after_seconds = 0
# Required in live mode. While halted, only exact open-order IDs independently
# returned by the authoritative account query may be cancelled.
cancel_known_open_orders_while_halted = true

[staking]
enabled = false
validator_allowlist = []
residual_hype_wei = 0
# Zero disables automatic staking. Eligible fills must be registered by the
# independent reconciler within this period after first authoritative observation.
fill_registration_deadline_seconds = 0
# Safe default; the staking-account alternative requires explicit approval.
no_eligible_validator_policy = "hold_in_spot"

[operator]
dry_run = true
manual_halt = true
# Versioned acknowledgement of the effective-policy digest, which excludes this
# value itself and includes startup-resolved identities such as the admitted
# parent account.
live_acknowledgement = ""
live_acknowledgement_expires_at = ""
